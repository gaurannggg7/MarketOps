# Overlay: serve the same origin over HTTPS on :8443 with Secure cookies.
#   scripts/make_dev_cert.sh
#   MARKETOPS_PROXY_COOKIE_SECURE=true docker compose -f docker-compose.yml -f docker-compose.tls.yml --profile app up -d --wait
services:
  web:
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./infra/certs:/etc/nginx/certs:ro
      - ./infra/nginx/tls.conf:/etc/nginx/conf.d/tls.conf:ro
