name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PGUSER: marketops
  PGPASSWORD: marketops-local-only

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: marketops
          POSTGRES_PASSWORD: marketops-local-only
          POSTGRES_DB: marketops
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketops" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      MARKETOPS_DATABASE_URL: postgresql+psycopg://marketops:marketops-local-only@localhost:55432/marketops
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install (hashed lockfile)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --require-hashes -r backend/requirements-dev.lock
      - name: Ruff
        working-directory: backend
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: mypy (strict)
        working-directory: backend
        run: .venv/bin/mypy app tests
      - name: Migrations apply and match models
        working-directory: backend
        run: .venv/bin/alembic upgrade head && .venv/bin/alembic check
      - name: pytest (PostgreSQL)
        working-directory: backend
        run: .venv/bin/pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: API contract drift
        run: |
          (cd frontend && npm ci)
          make api-check

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: marketops
          POSTGRES_PASSWORD: marketops-local-only
          POSTGRES_DB: marketops
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketops" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --require-hashes -r backend/requirements-dev.lock
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright (same-origin topology)
        working-directory: frontend
        run: npx playwright test
      - name: Playwright (split-origin topology, stream tickets — Vercel + Render layout)
        working-directory: frontend
        run: npx playwright test -c playwright.split.config.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Secret scan (tracked files)
        run: bash scripts/secret_scan.sh

  images:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build versioned images
        run: docker compose --profile app build
      - name: Validate production compose file
        run: |
          cp deploy/.env.production.example /tmp/prod.env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^DEMO_\(.*\)_PASSWORD=$/DEMO_\1_PASSWORD=ci-only-password/' /tmp/prod.env
          docker compose -f deploy/docker-compose.prod.yml --env-file /tmp/prod.env config --quiet
      - name: Start container stack (db + backend + nginx web) and seed
        env:
          DEMO_OPERATOR_PASSWORD: ci-only-operator-password
          DEMO_OPERATOR2_PASSWORD: ci-only-operator2-password
          DEMO_VIEWER_PASSWORD: ci-only-viewer-password
        run: |
          docker compose --profile app up -d --wait
          docker compose --profile app exec -T backend python -m app.seed
      - name: Smoke checks through nginx (:8080)
        env:
          DEMO_OPERATOR_PASSWORD: ci-only-operator-password
          MARKETOPS_URL: http://localhost:8080
        run: |
          python -m venv /tmp/smoke && /tmp/smoke/bin/pip install -q httpx==0.28.1 websockets==17.2 python-dotenv==1.2.4
          sleep 20  # stale-check warm-up so the incident check can fire
          /tmp/smoke/bin/python scripts/smoke.py
      - name: Container logs on failure
        if: failure()
        run: docker compose --profile app logs --tail 200
      - name: Image inventory
        run: docker image ls 'marketops-*'
